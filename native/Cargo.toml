[package]
name = "figure-export-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
jpeg-encoder = "0.6.0"
png = "0.17.16"
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
svg2pdf = "0.13.0"
tiff = "0.9.1"
usvg = "0.45.0"
resvg = "0.45.0"
webp = "0.3.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[dev-dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }
